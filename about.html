<!doctype html>
<html lang="ko">
<head>
  <title>About Me — mjform</title>
  <script src="./js/head.js" data-base="." data-page-css="./styles/about.css"></script>

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="MJFORM Portfolio">
  <meta property="og:description" content="사용자와 정보를 연결하는 명확하고 담백한 디자인을 기록했습니다.">
  <meta property="og:image" content="https://mjform.vercel.app/assets/social/og-image.png">
  <meta property="og:url" content="https://mjform.vercel.app/pages/banner.html">
  <meta property="og:site_name" content="MJFORM">

  <!-- Twitter(X) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MJFORM Portfolio">
  <meta name="twitter:description" content="사용자와 정보를 연결하는 명확하고 담백한 디자인을 기록했습니다.">
  <meta name="twitter:image" content="https://mjform.vercel.app/assets/social/og-image.png">

  <!-- Favicon -->
  <link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
</head>

<body class="about-page">
  <main class="about-screen">
    <header class="about-heading">
      <h1>About Me</h1>
      <p>사용자와 정보를 연결하는 명확하고 담백한 디자인을 기록했습니다.</p>
    </header>

    <a class="about-close" href="./index.html" aria-label="메인 페이지로 돌아가기">
      <img src="./assets/about-me/About_close_icon.svg" alt="">
    </a>

    <section class="about-content" aria-label="지민정 소개">
      <div class="profile-visual">
        <img class="profile-me" src="./assets/about-me/mE.svg" alt="" aria-hidden="true">

        <div class="profile-frame">
          <img class="profile-frame-line" src="./assets/about-me/Frame_line.svg" alt="" aria-hidden="true">
          <img class="profile-image" src="./assets/about-me/Preparing_Image.svg" alt="이미지 준비중">
        </div>
      </div>

      <div class="profile-info">
        <dl class="profile-basic">
          <div>
            <dt>Name</dt>
            <dd>지 민정</dd>
          </div>
          <div>
            <dt>Age</dt>
            <dd>2000.03.31</dd>
          </div>
        </dl>

        <section class="info-section">
          <h2>Certification</h2>
          <ul>
            <li>컴퓨터그래픽스기능사</li>
            <li>웹디자인기능사</li>
          </ul>
        </section>

        <section class="info-section skills-section">
          <h2>Technical Skills</h2>
          <div class="skill-icons" aria-label="활용 프로그램">
            <img src="./assets/about-me/Photoshop_icon.svg" alt="Photoshop">
            <img src="./assets/about-me/Illustrator_icon.svg" alt="Illustrator">
            <img src="./assets/about-me/InDesign_icon.svg" alt="InDesign">
            <img src="./assets/about-me/Premier Pro_icon.svg" alt="Premiere Pro">
            <img src="./assets/about-me/After Effects.svg" alt="After Effects">
            <img src="./assets/about-me/Figma_icon.svg" alt="Figma">
            <img src="./assets/about-me/EditPlus_icon.svg" alt="EditPlus">
            <img src="./assets/about-me/VS Code_icon.svg" alt="Visual Studio Code">
            <img src="./assets/about-me/ChatGPT.svg" alt="ChatGPT">
            <img src="./assets/about-me/Colored_icon.svg" alt="Claude">
            <img src="./assets/about-me/Midjourney_icon.svg" alt="Midjourney">
            <img src="./assets/about-me/gemini_icon.svg" alt="Gemini">
          </div>
        </section>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const closeButton = document.querySelector('.about-close');
      if (!closeButton || window.parent === window) return;

      closeButton.addEventListener('click', (event) => {
        event.preventDefault();
        window.parent.postMessage('close-about-panel', '*');
      });
    })();
  </script>
</body>
</html>
